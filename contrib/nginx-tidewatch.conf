# nginx: point root at public/
server {
    listen 80;
    server_name tidewatch.lan;
    root /var/www/html/snmp-monitor/public;
    index index.php;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }
}
