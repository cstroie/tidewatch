# Tidewatch for lighttpd: serve only public/, hide everything else.
# Install: sudo cp contrib/lighttpd-tidewatch.conf /etc/lighttpd/conf-enabled/90-tidewatch.conf
#          sudo systemctl reload lighttpd
# Then open http://<host>/tidewatch/

# /tidewatch redirects to the app
url.redirect += ( "^/tidewatch$" => "/tidewatch/" )

alias.url += ( "/tidewatch/" => "/var/www/tidewatch/public/" )

# Live mode: stream Server-Sent Events instead of buffering the whole response
$HTTP["url"] =~ "^/tidewatch/live\.php" {
    server.stream-response-body = 2
}
